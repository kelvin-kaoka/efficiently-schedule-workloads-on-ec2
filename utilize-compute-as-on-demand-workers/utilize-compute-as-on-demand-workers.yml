####INSTANCE PROFILE
  AutoTurkingInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: "/"
      Roles:
        - Ref: AutoturkingAutoScalingInstanceProfileRole

####SECURITY GROUP
  AutoTurkingSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref VPCDEFAULT
      GroupDescription: Allows ingress and egress traffic
      GroupName: !Ref AUTOTURKINGSECURITYGROUPNAME
      Tags:
        - Value: Project
          Key: autoturking

  AutoTurkingSecurityGroupHTTPsIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allows ingress https traffic from nat gateway to instance that runs the the M-Turk project
      GroupId: !GetAtt AutoTurkingSecurityGroup.GroupId
      IpProtocol: tcp #"-1"
      FromPort: 443 #0
      ToPort: 443 #65535
      CidrIp: 0.0.0.0/0

  AutoTurkingSecurityGroupHTTPIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allows ingress http traffic from nat gateway to instance that runs the M-Turk project
      GroupId: !GetAtt AutoTurkingSecurityGroup.GroupId
      IpProtocol: tcp #"-1"
      FromPort: 80 #0
      ToPort: 80 #65535
      CidrIp: 0.0.0.0/0

  AutoTurkingSecurityGroupHTTPsEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      Description: Allows egress https traffic from instance that runs the M-Turk project
      GroupId: !GetAtt AutoTurkingSecurityGroup.GroupId
      IpProtocol: tcp #"-1"
      FromPort: 443 #0
      ToPort: 443 #65535
      CidrIp: 0.0.0.0/0

  AutoTurkingSecurityGroupHTTPEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      Description: Allows egress http traffic from instance that runs the M-Turk project
      GroupId: !GetAtt AutoTurkingSecurityGroup.GroupId
      IpProtocol: tcp #"-1"
      FromPort: 80 #0
      ToPort: 80 #65535
      CidrIp: 0.0.0.0/0

####EC2 LAUNCHTEMPLATE
  AutoTurkingLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Ref AUTOTURKINGLAUNCHTEMPLATENAME
      LaunchTemplateData:
        ImageId: !Ref AUTOTURKINGAMIID #add string
        InstanceInitiatedShutdownBehavior: terminate
        IamInstanceProfile: 
          Arn: !GetAtt AutoTurkingInstanceProfile.Arn
        BlockDeviceMappings: 
          - DeviceName: /dev/xvda
            Ebs: 
              VolumeSize: 30
              VolumeType: gp3
              DeleteOnTermination: true
              Throughput: 150
              Iops: 3000
        InstanceType: !Ref AUTOTURKINGINSTANCETYPE
        # InstanceRequirements:
        #   AllowedInstanceTypes:
        #     # - c7gn.*
        #     - c7g.*
        #     - m7g.*
        #   MemoryMiB:
        #     Max: 16
        #     Min: 4
        #   VCpuCount:
        #     Max: 8
        #     Min: 4
        # KeyName: #add string
        SecurityGroupIds:
          - !Ref AutoTurkingSecurityGroup
        TagSpecifications:
          - ResourceType: "instance"
            Tags:
            - Key: "Project"
              Value: "autoturking"
          - ResourceType: "volume"
            Tags:
            - Key: "Project"
              Value: "autoturking"
      TagSpecifications:
        - ResourceType: "launch-template"
          Tags:
          - Key: "Project"
            Value: "autoturking"
      VersionDescription: "Runs mturk project"

####ASG
  AutoTurkingAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Ref AUTOTURKINGASGNAME
      DefaultInstanceWarmup: 300
      # AvailabilityZones:
      #   - us-west-2a #where the primary db is 
      VPCZoneIdentifier:
        - !Ref AUTOTURKINGPRIVATESUBNET #!Select [ 0, !GetAZs '' ] #subnet-7b889f1e #where the primary db is 
      LaunchTemplate:
        LaunchTemplateId: !Ref AutoTurkingLaunchTemplate
        Version: !GetAtt AutoTurkingLaunchTemplate.LatestVersionNumber
      MaxSize: 1
      MinSize: 0
      DesiredCapacity: 0
      ServiceLinkedRoleARN: !Ref AWSSERVICEROLEFORAUTOSCALING
      TerminationPolicies:
        - ClosestToNextInstanceHour
      Tags:
        - Key: "Project"
          PropagateAtLaunch: false
          Value: "autoturking"

####SNS
  AutoTurkingASGSNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: "Notification from M-Turk worker"
      TopicName: !Join ['-', ['auto-turking-asg-reset-asg-desired-capacity-topic', !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]]] #required to be unique as there is no replace
      Tags:
        - Key: "Project"
          Value: "autoturking"

  AutoTurkingASGSNSSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Endpoint: !GetAtt AutoTurkingResetASGDesiredCapacityFunction.Arn #AutoTurkingResetASGDesiredCapacityFunctionUrl.FunctionUrl
      Protocol: lambda #https ##function urls not supported for role based policies and instead used in indentity-based policies
      TopicArn: !Ref AutoTurkingASGSNSTopic

  AutoTurkingASGSNSTopicPolicy:
    Type: 'AWS::SNS::TopicPolicy'
    Properties:
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: 'sns:Publish'
            Resource: "*"
      Topics:
        - !Ref AutoTurkingASGSNSTopic