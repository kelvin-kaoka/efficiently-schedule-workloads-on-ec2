####LAMBDA PERMISSION
  AutoTurkingResetASGDesiredCapacityEventPermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !Ref AutoTurkingResetASGDesiredCapacityFunction
        Action: lambda:InvokeFunction #lambda:InvokeFunctionUrl is not supported for resource based policies and is only used with principals
        Principal: sns.amazonaws.com
        SourceArn: !GetAtt AutoTurkingASGSNSTopic.TopicArn

  AutoTurkingUpdateScalingPolicyFunctionEventPermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !Ref AutoTurkingUpdateScalingPolicyFunction
        Action: lambda:InvokeFunction
        Principal: events.amazonaws.com
        SourceArn: !GetAtt AutoTurkingUpdateScalingPolicyFunctionAutoturkingS3PrefixPartitionedPutEventRule.Arn

