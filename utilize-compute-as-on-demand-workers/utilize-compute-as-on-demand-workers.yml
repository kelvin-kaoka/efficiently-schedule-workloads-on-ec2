AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Written in a mix of python3 aws sdk and cloudformation
  This is template implements a full event driven architecture that, 
  Launches and ec2 instance to execute the mturk project using a launch template and an auto scaling group,
  And shuts down using a scaling policy and an optional cpu utilization scaling policy(Disabled).

Parameters:
  AUTOTURKINGASGNAME:
    Type: String
    Default: AutoTurkingASG
  AUTOTURKINGLAUNCHTEMPLATENAME:
    Type: String
    Default: AutoTurkingLaunchTemplate
  AUTOTURKINGAMIID:
    Type: AWS::EC2::Image::Id
    Default: ami-<custom-ami-id> #custom ami id for the mturk project
  AUTOTURKINGINSTANCETYPE:
    Type: String
    Default: t3.micro
  AUTOTURKINGPRIVATESUBNET:
    Type: String
    Default: subnet-<id> #private subnet1 subnet-06e2026121d959a8e
  AUTOTURKINGSECURITYGROUPNAME:
    Description: Security Group Name for instance that runs the M-Turk project
    Type: String
    Default: M-Turk-sg
  VPCDEFAULT:
    Description: Default VPC ID
    Type: AWS::EC2::VPC::Id
    Default: vpc-<id> ###workload vpc
  AWSSERVICEROLEFORAUTOSCALING:
    Description: Service Role for Auto Scaling
    Type: String
    Default: "" #default arn for service role for auto scaling

# Globals:
#   Function:

Resources:
####LAMBDA
  AutoTurkingResetASGDesiredCapacityFunction:
    Type: AWS::Serverless::Function
    DependsOn: AutoTurkingAutoScalingGroup
    Properties:
      FunctionName: AutoTurkingResetASGDesiredCapacityFunction
      Description: "This function resets the asg desired size to 0, draining the M-Turk worker"
      Environment:
        Variables:
          ASG_NAME: !Ref AUTOTURKINGASGNAME
      Architectures:
        # - x86_64
        - arm64
      InlineCode: |
        #use set_desired_capacity to reset the desired capacity of the autoscaling group to 0
        import boto3
        import json
        import logging
        import os
        import sys
        from botocore.exceptions import ClientError

        client = boto3.client('autoscaling')

        #Set up logging
        logger = logging.getLogger()
        logger.setLevel(logging.INFO)

        def log(msg):
            logger.info(msg)

        #validate environment variables
        def validate_env_var(var_name):
            value = os.environ.get(var_name)
            if not value:
                log(f"ERROR: Environment variable '{var_name}' not set.")
                sys.exit(1)
            return value
        
        # def lambda_subscription_url(subscribe_url):
        #     try:
        #         for record in event['Records']:
        #             sns_message = record['Sns']
        #             message_type = sns_message.get('Type', '') 
        #             if message_type == 'SubscriptionConfirmation':
        #                 # Extract the SubscribeURL from the message
        #                 subscribe_url = sns_message.get('SubscribeURL', '')
        #                 logger.info("Subscription confirmation URL: %s", subscribe_url)
        #     except Exception as e:
        #         logger.error(f"Error processing record: {e}")

        #reset desired capacity of autoscaling group to 0
        asg_name = validate_env_var("ASG_NAME")
        def drain_worker(asg_name):
            #add a try except block to catch any errors that may occur
            try:
                response = client.set_desired_capacity(
                    AutoScalingGroupName=asg_name,
                    DesiredCapacity=0,
                    HonorCooldown=False
                )
                return response
            except ClientError as e:
                logger.error(
                    "Couldn't set desired capacity %s. Here's why: %s: %s",
                    asg_name,
                    e.response["Error"]["Code"],
                    e.response["Error"]["Message"],
                )
                raise

        #add a lambda_handler to call the drain_worker function
        def lambda_handler(event, context):
            #log the recieved event
            log(f"Received event: {json.dumps(event)}")
            # lambda_subscription_url(subscribe_url)  
            drain_worker(asg_name)
            return {
                'statusCode': 200,
                'body': json.dumps('AutoTurking Auto Scaling Group Reset and M-Turk worker has been drained!')
            }
      PackageType: Zip
      Handler: index.lambda_handler
      MemorySize: 128
      # VpcConfig:
      #   # Ipv6AllowedForDualStack: True
      #   SecurityGroupIds:
      #     - sg-51130a35 #default sg
      #   SubnetIds:
      #     - subnet-7b889f1e #where the primary db is
      Role:
        Fn::GetAtt:
        - AutoTurkingDrainASGsRole
        - Arn
      Runtime: python3.14
      Timeout: 60
      # FunctionUrlConfig:
      #   AuthType: AWS_IAM
      #   InvokeMode: BUFFERED
      PropagateTags: False
      Tags:
        Project: auto-turking
        Deployment: zip

  AutoTurkingUpdateScalingPolicyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: AutoTurkingUpdateScalingPolicyFunction
      Description: "This function increases the asg desired size to 1, provisioning the M-Turk worker"
      Architectures:
        # - x86_64
        - arm64
      Environment:
        Variables:
          ASG_NAME: !Ref AUTOTURKINGASGNAME
      Events:
        AutoturkingS3PrefixPartitionedPutEventRule:
          Type: EventBridgeRule
          Properties:
            EventBusName: default
            RuleName: AutoturkingS3EventCreateObjectOnPrefPartitionedASGPolicyRule
            State: ENABLED
            Pattern:
              source:
              - aws.s3
              detail-type:
              - Object Created
              detail:
                bucket:
                  name:
                  - auto-turking
                object:
                  key:
                  - partitioned
                reason:
                - PutObject
            Target:
              Id: !Ref AutoTurkingUpdateScalingPolicyFunction
