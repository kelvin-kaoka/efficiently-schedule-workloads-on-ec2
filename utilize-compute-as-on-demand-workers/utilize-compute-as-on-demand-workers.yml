    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Description: 'Update ASGs Role Created by Cloudformation'
      Policies:
      - PolicyName: 'auto-turking-lambda-execution-for-updating-ASGs-policies'
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            Resource:
            - Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*
          - Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
            - Fn::Sub:
              - arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${FunctionName}*
              - FunctionName: AutoTurkingUpdateScalingPolicyFunction
          # - Effect: Allow
          #   Action:
          #   - autoscaling:CompleteLifecycleAction
          #   Resource: 
          #   - !Sub "arn:aws:autoscaling:*:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/AutoTurkingASG"
          - Effect: Allow
            Action:
            - ec2:*
            Resource: "*"
          - Effect: Allow
            Action:
            - autoscaling:*
            Resource: "*"
          - Effect: Allow
            Action:
            - ec2:*
            Resource: "*"
          - Effect: Allow
            Action:
            - cloudwatch:*
            Resource: "*"
          - Effect: Allow
            Action:
            - events:*
            Resource: "*"

